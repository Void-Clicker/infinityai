<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinity AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f0f0f; color: white; display: flex; flex-direction: column; height: 100vh; }
    h1 { text-align: center; padding: 16px; font-size: 20px; border-bottom: 1px solid #222; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
    .user { background: #7F77DD; align-self: flex-end; }
    .ai { background: #222; align-self: flex-start; }
    #input-area { display: flex; padding: 12px; gap: 8px; border-top: 1px solid #222; }
    input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: #222; color: white; font-size: 14px; }
    button { padding: 10px 20px; border-radius: 20px; border: none; background: #7F77DD; color: white; cursor: pointer; font-size: 14px; }
    button:hover { background: #534AB7; }
  </style>
</head>
<body>
  <h1>Infinity AI</h1>
  <div id="chat-box"></div>
  <div id="input-area">
    <input id="user-input" type="text" placeholder="Type a message..." />
    <button onclick="sendMessage()">Send</button>
  </div>
  <script>
    async function sendMessage() {
      const input = document.getElementById("user-input");
      const msg = input.value.trim();
      if (!msg) return;
      addMessage(msg, "user");
      input.value = "";
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      addMessage(data.reply, "ai");
    }
    function addMessage(text, role) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
    document.getElementById("user-input").addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
