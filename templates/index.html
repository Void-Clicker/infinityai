<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="Infinty.png" type="image/x-icon" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infinity AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Segoe UI', sans-serif; 
      background: #0a0a0f; 
      color: white; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      transition: background 0.4s, color 0.4s;
    }
    body.light-mode { background: #f8f9fa; color: #222; }

    header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 14px 20px; 
      background: #111118; 
      border-bottom: 1px solid #222; 
    }
    body.light-mode header { background: #ffffff; color: #222; border-bottom: 1px solid #ddd; }

    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-circle { 
      width: 34px; height: 34px; border-radius: 50%; 
      background: #7F77DD; 
      display: flex; align-items: center; justify-content: center; 
      font-weight: 700; font-size: 14px; 
    }
    .logo-text { font-size: 16px; font-weight: 600; }
    .logo-sub { font-size: 11px; color: #888; }

    button {
      background: transparent; 
      border: 1px solid #333; 
      color: #888; 
      padding: 6px 14px; 
      border-radius: 20px; 
      cursor: pointer; 
      font-size: 12px; 
    }
    body.light-mode button { border-color: #ccc; color: #555; }
    button:hover { border-color: #555; color: white; }
    body.light-mode button:hover { color: black; border-color: #999; }

    .extra-btn { background: #7F77DD; color: white; border: none; }

    #chat-box { 
      flex: 1; 
      overflow-y: auto; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg-row.user { flex-direction: row-reverse; }
    .avatar { 
      width: 28px; height: 28px; border-radius: 50%; 
      display: flex; align-items: center; justify-content: center; 
      font-size: 11px; font-weight: 700; flex-shrink: 0; 
    }
    .avatar.ai { background: #7F77DD; }
    .avatar.user { background: #333; }

    .msg { 
      max-width: 65%; 
      padding: 10px 14px; 
      border-radius: 18px; 
      font-size: 14px; 
      line-height: 1.6; 
      position: relative;
    }
    .msg.user { background: #7F77DD; color: white; }
    .msg.ai { background: #1a1a24; color: white; }
    body.light-mode .msg.ai { background: #e5e5e5; color: #222; }

    .copy-btn {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.4); color: white;
      border: none; padding: 2px 6px; border-radius: 10px;
      font-size: 10px; cursor: pointer; opacity: 0;
    }
    body.light-mode .copy-btn { background: rgba(0,0,0,0.2); color: #222; }
    .msg:hover .copy-btn { opacity: 1; }

    #input-area { 
      display: flex; padding: 14px 16px; gap: 8px; 
      border-top: 1px solid #222; background: #111118; 
    }
    body.light-mode #input-area { background: #ffffff; border-top: 1px solid #ddd; }

    #user-input { 
      flex: 1; padding: 10px 16px; border-radius: 24px; 
      border: 1px solid #333; background: #1a1a24; color: white; 
      font-size: 14px; outline: none; 
    }
    body.light-mode #user-input { background: white; color: black; border-color: #ccc; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-circle">AI</div>
      <div>
        <div class="logo-text">Infinity AI</div>
        <div class="logo-sub">Always online, always helpful</div>
      </div>
    </div>
    <div>
      <button onclick="toggleTheme()">🌙</button>
      <button class="extra-btn" onclick="showStats()">Stats</button>
      <button class="extra-btn" onclick="showPortfolio()">Portfolio</button>
      <button class="extra-btn" onclick="viewSavedFiles()">Saved Files</button>
      <button class="extra-btn" onclick="exportAllFiles()">Export All</button>
      <button onclick="setName()">Set My Name</button>
      <button class="extra-btn" onclick="uploadFile()">Upload File</button>
      <button onclick="clearChat()">Clear</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="input-area">
    <input id="user-input" type="text" placeholder="Message Infinity AI..." />
    <button id="send-btn" onclick="sendMessage()">&#9650;</button>
    <button id="voice-btn" onclick="startVoiceInput()">🎤</button>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const input = document.getElementById("user-input");
    let userName = "You";   // Default

    function addMessage(text, role) {
      const row = document.createElement("div");
      row.className = "msg-row " + role;
      const avatar = document.createElement("div");
      avatar.className = "avatar " + role;
      avatar.textContent = role === "user" ? userName.substring(0,2).toUpperCase() : "AI";
      const msg = document.createElement("div");
      msg.className = "msg " + role;
      msg.innerHTML = text.replace(/\n/g, "<br>");

      const copyBtn = document.createElement("button");
      copyBtn.className = "copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.textContent = "Copied!";
        setTimeout(() => copyBtn.textContent = "Copy", 1500);
      };
      msg.appendChild(copyBtn);

      row.appendChild(avatar);
      row.appendChild(msg);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const msg = input.value.trim();
      if (!msg) return;
      addMessage(msg, "user");
      input.value = "";

      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      addMessage(data.reply, "ai");
    }

    async function setName() {
      const name = prompt("What is your name?");
      if (!name) return;
      userName = name;
      const res = await fetch("/setname", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: name})
      });
      const data = await res.json();
      addMessage(data.reply, "ai");
    }

    // Rest of your functions (clearChat, viewSavedFiles, exportAllFiles, showPortfolio, showStats, uploadFile, toggleTheme, startVoiceInput, etc.)
    function clearChat() {
      chatBox.innerHTML = "";
      fetch("/clear", { method: "POST" });
      addMessage("Hi! I'm Infinity AI. How can I help you today?", "ai");
    }

    async function viewSavedFiles() {
      const res = await fetch("/files");
      const data = await res.json();
      let text = "📁 Saved Files:\n\n";
      if (data.files && data.files.length > 0) {
        data.files.forEach(f => text += "• " + f + "\n");
      } else {
        text += "No files yet.";
      }
      addMessage(text, "ai");
    }

    async function exportAllFiles() {
      const res = await fetch("/export");
      if (res.ok) {
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "infinity_ai_exports.zip";
        a.click();
        addMessage("✅ Files downloaded!", "ai");
      }
    }

    async function showPortfolio() {
      const res = await fetch("/portfolio");
      const data = await res.json();
      addMessage(data.reply, "ai");
    }

    async function showStats() {
      const res = await fetch("/stats");
      const data = await res.json();
      addMessage(data.reply, "ai");
    }

    async function uploadFile() {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = ".txt";
      input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;
        const formData = new FormData();
        formData.append("file", file);
        addMessage(`Uploading ${file.name}...`, "ai");
        try {
          const res = await fetch("/upload", {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          addMessage(data.reply, "ai");
        } catch (e) {
          addMessage("Upload failed.", "ai");
        }
      };
      input.click();
    }

    function toggleTheme() {
      document.body.classList.toggle("light-mode");
    }

    function startVoiceInput() {
      if (!('SpeechRecognition' in window || 'webkitSpeechRecognition' in window)) {
        addMessage("Voice input not supported in this browser.", "ai");
        return;
      }
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.onresult = (e) => {
        input.value = e.results[0][0].transcript;
        sendMessage();
      };
      recognition.start();
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    addMessage("Hi! I'm Infinity AI. How can I help you today?", "ai");
  </script>
</body>
</html>
